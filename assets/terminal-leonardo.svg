<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo Shande — Cybersecurity Terminal</title>
  <desc id="desc">A dark terminal window with green prompts introducing Leonardo's cybersecurity learning journey.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="984" height="334" rx="15" fill="url(#bg)" stroke="#303943" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M23 8 H977 A15 15 0 0 1 992 23 V48 H8 V23 A15 15 0 0 1 23 8Z" fill="#171d25"/>
  <path d="M8 48 H992" stroke="#303943"/>
  <circle cx="32" cy="28" r="7" fill="#ff6058"/>
  <circle cx="56" cy="28" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="28" r="7" fill="#28c840"/>
  <text x="500" y="33" fill="#a7b0bc" font-family="Consolas, 'Courier New', monospace" font-size="13" text-anchor="middle">leo@github: ~ — zsh</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="38" y="83" fill="#39d353" font-weight="700">leo@github</text>
    <text x="142" y="83" fill="#c9d1d9">:~$ whoami</text>

    <text x="38" y="119" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Leonardo Shande</text>
    <text x="38" y="148" fill="#39d353" font-size="16">Cybersecurity Engineer in Training</text>

    <text x="38" y="190" fill="#39d353" font-weight="700">leo@github</text>
    <text x="142" y="190" fill="#c9d1d9">:~$ cat skills.txt</text>
    <text x="38" y="220" fill="#9da7b3">Python · Linux · AWS · TypeScript · JavaScript</text>

    <text x="38" y="261" fill="#39d353" font-weight="700">leo@github</text>
    <text x="142" y="261" fill="#c9d1d9">:~$ ./start_learning.sh</text>
    <text x="38" y="291" fill="#9da7b3">Building. Securing. Learning.</text>

    <text x="38" y="322" fill="#39d353" font-weight="700">leo@github</text>
    <text x="142" y="322" fill="#c9d1d9">:~$</text>
    <rect x="190" y="307" width="10" height="18" rx="1" fill="#39d353"/>
  </g>
</svg>
